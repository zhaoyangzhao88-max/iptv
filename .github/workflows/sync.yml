name: IPTV Reputation Sync (disabled)

# Snapshot publication is owned exclusively by daily_wash.yml.  Keeping this
# workflow as a manual no-op avoids two scheduled jobs racing on one baseline.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Snapshot publication is handled by daily_wash.yml"
