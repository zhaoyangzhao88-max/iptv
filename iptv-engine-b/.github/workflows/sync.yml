name: IPTV-Engine-B Auto Sync Pipeline

on:
  schedule:
    # 定时调度：每 12 小时（半天，中午12点和半夜24点）自动唤醒云端机器人运行一次，完美不超标
    - cron: '0 */12 * * *'
  workflow_dispatch: # 支持你在 GitHub 页面上点 Run 按钮手动立刻运行

jobs:
  sync_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # 自动在云端建立 pip 缓存，加速运行，保护 Actions 时间额度

      - name: Install Dependencies
        run: |
          pip install -r python_engine/requirements.txt

      - name: Run IPTV Engine Core Pipeline
        run: |
          # 注入 PYTHONPATH，彻底清除 Python 包路径导入的玄学崩溃
          export PYTHONPATH=$PYTHONPATH:.
          python python_engine/src/main.py

      - name: Commit and Push Database Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 仅在我们的"功德簿"（history_scores.json）由于积分扣分发生变动时才提交，绝对避免空提交
          git add python_engine/data/history_scores.json

          git commit -m "chore(data): auto sync reputation scores [skip ci]" || echo "No changes to commit"
          git push
